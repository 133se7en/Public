<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🜊 L'Or du Rhin — Une aventure dans le Rheingold de Wagner</title>
<style>
  :root {
    --bg: #0a0d18;
    --panel: #131829;
    --panel2: #1a2138;
    --gold: #d4af37;
    --gold-dim: #8a7326;
    --text: #d8dcea;
    --muted: #8b93ad;
    --accent: #5a7bd8;
    --danger: #c05555;
    --success: #5ab87a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #1a2242 0%, var(--bg) 60%);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    padding: 14px 10px 8px;
    border-bottom: 1px solid var(--gold-dim);
    background: linear-gradient(180deg, rgba(212,175,55,.08), transparent);
  }
  header h1 {
    font-variant: small-caps;
    letter-spacing: 4px;
    color: var(--gold);
    font-size: 1.6rem;
    text-shadow: 0 0 18px rgba(212,175,55,.35);
  }
  header .sub { color: var(--muted); font-style: italic; font-size: .85rem; }
  #layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 12px;
    padding: 12px;
    flex: 1;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  @media (max-width: 900px) { #layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid #2a3350;
    border-radius: 10px;
    padding: 14px;
  }
  #main-panel { display: flex; flex-direction: column; min-height: 60vh; }
  #location {
    font-variant: small-caps;
    color: var(--gold);
    font-size: 1.25rem;
    border-bottom: 1px solid var(--gold-dim);
    padding-bottom: 6px;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  #story {
    flex: 1;
    line-height: 1.65;
    padding: 6px 2px;
    min-height: 200px;
    max-height: 55vh;
    overflow-y: auto;
    font-size: 1.02rem;
  }
  #story > div { margin-bottom: 10px; white-space: pre-wrap; }
  #story .dim { color: var(--muted); }
  #story .gold { color: var(--gold); }
  #story .danger { color: var(--danger); }
  #story .rhine { color: #7db3dd; }
  #story .success { color: var(--success); }
  #choices { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .choice {
    text-align: left;
    background: var(--panel2);
    border: 1px solid #34406a;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    font-size: .98rem;
    transition: all .15s;
  }
  .choice:hover { border-color: var(--gold); background: #223054; color: #fff; }
  .choice.quest { border-left: 4px solid var(--accent); }
  .choice.gold { border-left: 4px solid var(--gold); }
  #sidebar { display: flex; flex-direction: column; gap: 12px; }
  .panel h3 {
    font-variant: small-caps;
    color: var(--gold);
    letter-spacing: 2px;
    font-size: 1rem;
    margin-bottom: 8px;
    border-bottom: 1px solid #2a3350;
    padding-bottom: 4px;
  }
  .stat { display: flex; justify-content: space-between; padding: 3px 0; font-size: .92rem; }
  .stat .val { color: var(--gold); }
  .bar { height: 8px; background: #0d1120; border-radius: 4px; margin: 3px 0 7px; overflow: hidden; border: 1px solid #2a3350;}
  .bar > div { height: 100%; transition: width .3s; }
  #hp-bar > div { background: linear-gradient(90deg, #b04a4a, #d47a4a); }
  #honor-bar > div { background: linear-gradient(90deg, #4a6ab0, #7ab0d4); }
  .tag {
    display: inline-block;
    background: #223054;
    border: 1px solid #34406a;
    border-radius: 12px;
    padding: 2px 9px;
    font-size: .82rem;
    margin: 2px 3px 2px 0;
    cursor: help;
  }
  .tag.item { color: var(--gold); border-color: var(--gold-dim); }
  .tag.skill { color: #9ad4b0; border-color: #2f6a4a; }
  #log { font-size: .82rem; color: var(--muted); max-height: 120px; overflow-y: auto; line-height: 1.5;}
  #log div { padding: 1px 0; border-bottom: 1px dotted #1c2440;}
  .topbtns { display: flex; gap: 8px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .tbtn {
    background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: .85rem;
  }
  .tbtn:hover { background: rgba(212,175,55,.12); }
  #overlay {
    position: fixed; inset: 0; background: rgba(4,6,12,.88);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #overlay .box {
    background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 12px;
    max-width: 640px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto;
  }
  #overlay h2 { color: var(--gold); font-variant: small-caps; letter-spacing: 3px; margin-bottom: 12px; }
  #overlay p { line-height: 1.6; margin-bottom: 10px; }
  .riddle-input {
    width: 100%; padding: 10px; background: #0d1120; border: 1px solid var(--gold-dim);
    color: var(--gold); font-family: inherit; font-size: 1rem; border-radius: 6px; margin: 8px 0;
  }
</style>
</head>
<body>

<header>
  <h1>🜊 L'Or du Rhin</h1>
  <div class="sub">Une aventure au cœur de <em>Das Rheingold</em> de Richard Wagner</div>
  <div class="topbtns">
    <button class="tbtn" onclick="Game.showHelp()">📜 Aide</button>
    <button class="tbtn" onclick="Game.saveGame()">💾 Sauvegarder</button>
    <button class="tbtn" onclick="Game.loadGame()">📂 Charger</button>
    <button class="tbtn" onclick="Game.showQuests()">🗡 Quêtes</button>
    <button class="tbtn" onclick="Game.showAchievements()">🏆 Hauts faits</button>
    <button class="tbtn" onclick="Game.restart()">↺ Recommencer</button>
  </div>
</header>

<div id="layout">
  <div class="panel" id="main-panel">
    <div id="location">…</div>
    <div id="story"></div>
    <div id="choices"></div>
  </div>

  <div id="sidebar">
    <div class="panel" id="stats-panel">
      <h3>✦ État</h3>
      <div class="stat"><span>Nom</span><span class="val" id="s-name">—</span></div>
      <div class="stat"><span>Acte</span><span class="val" id="s-act">I</span></div>
      <div class="stat"><span>Vigueur</span><span class="val" id="s-hp">—</span></div>
      <div class="bar" id="hp-bar"><div style="width:100%"></div></div>
      <div class="stat"><span>Honneur</span><span class="val" id="s-honor">—</span></div>
      <div class="bar" id="honor-bar"><div style="width:50%"></div></div>
      <div class="stat"><span>Or</span><span class="val" id="s-gold">0</span></div>
      <div class="stat"><span>Renoncement</span><span class="val" id="s-love">—</span></div>
      <div class="stat"><span>Temps</span><span class="val" id="s-time">Aube</span></div>
    </div>
    <div class="panel">
      <h3>🎒 Sacoche</h3>
      <div id="inv"></div>
      <h3 style="margin-top:12px">🎼 Savoirs</h3>
      <div id="skills"></div>
    </div>
    <div class="panel">
      <h3>📖 Journal</h3>
      <div id="log"></div>
    </div>
  </div>
</div>

<div id="overlay"><div class="box" id="overlay-content"></div></div>

<script>
"use strict";
/* ============================================================
   L'OR DU RHIN — données : lieux, objets, quêtes, succès
   ============================================================ */

const LOCATIONS = {
  // ---- Scène I : le Rhin ----
  rhein_shallows: {
    name: "Les bas-fonds du Rhin",
    desc: (s) => `La lumière du matin d'or filtre à travers l'eau verte et claire. ${s.flags.maidens_met ? "Les ondes dansent autour de vous, pleines de rires étouffés." : "Quelque part, des rires de femmes résonnent dans le courant."} Un éclat d'or pur vacille sur un rocher au sommet d'une butte sous-marine.`,
    exits: [
      { to: "rhein_rock", label: "Nager vers le rocher lumineux" },
      { to: "rhein_depths", label: "Plonger vers les profondeurs sombres" },
      { to: "rhein_grotto", label: "Explorer la grotte de cristal" },
      { to: "valhalla_gate", label: "Remonter à la surface et longer la rive vers les cimes", if: (s)=>s.flags.knows_valhalla }
    ]
  },
  rhein_rock: {
    name: "Le Rocher de l'Or",
    desc: (s) => `Le fameux Or du Rhin, ${s.flags.gold_seen ? "que vous avez déjà contemplé" : "que vous voyez pour la première fois"}, brille d'un éclat que nul feu mortel ne saurait imiter. ${s.flags.maidens_met ? "Wellgunde, Woglinde et Floßhilde veillent à l'entour." : "Trois ondines nagent en cercle autour du rocher."}`,
    exits: [ { to: "rhein_shallows", label: "Redescendre vers les bas-fonds" } ]
  },
  rhein_depths: {
    name: "Les profondeurs du Rhin",
    desc: () => `L'eau y est noire et froide. Des épaves de navires anciens gisent dans la vase ; des os de géants des temps passés s'y entassent. Au loin, une lueur rouge trahit l'entrée des grottes de Nibelheim.`,
    exits: [
      { to: "rhein_shallows", label: "Remonter vers la lumière" },
      { to: "nibelheim_shaft", label: "Suivre la lueur rouge vers les galeries de Nibelheim", if: (s)=>s.flags.knows_nibelheim }
    ]
  },
  rhein_grotto: {
    name: "La grotte de cristal",
    desc: (s) => `Des voiles de cristal tissent les parois. ${s.flags.grotto_song ? "Les cristaux résonnent encore de votre chant — un motif gravé y persiste." : "L'eau y chante toute seule : les cristaux amplifient chaque son. Une inscription naine gravée au fond dit : « Seul un chant juste ouvre le cœur de la pierre. »"}`,
    exits: [ { to: "rhein_shallows", label: "Sortir de la grotte" } ]
  },

  // ---- Terres de surface ----
  valhalla_gate: {
    name: "Le pied du Walhalla",
    desc: (s) => `Sur la hauteur verdoyante, la forteresse des dieux achève de se dresser : le Walhalla, promesse de Wotan, bâti par les géants. ${s.flags.freia_taken ? "Freia n'est plus là pour arroser les pommes d'or — les dieux commencent à pâlir." : "Freia, déesse de la jeunesse, garde ses pommes d'or près de la forteresse."}`,
    exits: [
      { to: "rhein_shallows", label: "Redescendre vers le Rhin" },
      { to: "valhalla_hall", label: "Monter la rampe de pierre vers la salle du trône", if: (s)=>s.flags.wotan_met },
      { to: "gods_field", label: "Traverser le pré des dieux", if: (s)=>s.flags.wotan_met },
      { to: "giants_crag", label: "Monter au rocher des géants", if: (s)=>s.flags.giants_crag_open },
      { to: "earth_mound", label: "Chercher le tertre d'Erda au-delà du pré", if: (s)=>s.flags.knows_erda },
      { to: "final_shore", label: "Descendre au rivage du crépuscule", if: (s)=>s.flags.final_shore_open }
    ]
  },
  gods_field: {
    name: "Le pré des dieux",
    desc: (s) => `Une prairie suspendue entre brumes et lumière. ${s.flags.fafner_gone ? "Il n'y paraît plus rien qu'un silence inquiet." : "Fasolt et Fafner y reposent, massifs comme des montagnes, l'œil fixé sur la forteresse qu'ils ont bâtie."}`,
    exits: [
      { to: "valhalla_gate", label: "Revenir au pied du Walhalla" },
      { to: "rainbow_bridge", label: "S'avancer sur le pont de l'arc-en-ciel", if: (s)=>s.flags.bridge_built }
    ]
  },
  valhalla_hall: {
    name: "La salle du trône du Walhalla",
    desc: (s) => `Des colonnes de pierre montent vers une voûte où s'enroulent des serpents de brume. ${s.flags.wotan_met ? "Wotan, la lance en main, y délibère." : "Un trône vide attend son maître."} Fricka veille, soucieuse, près d'un banc de pierre.`,
    exits: [
      { to: "valhalla_gate", label: "Descendre au pied du Walhalla" },
      { to: "valhalla_rampart", label: "Monter au rempart", if: (s)=>s.act>=3 }
    ]
  },
  earth_mound: {
    name: "Le tertre d'Erda",
    desc: () => `Un monticule de terre noire d'où suinte une brume verte. Tout son de vie s'y éteint. On dit que la prophétesse Erda, la plus vieille du monde, y dort et y veille à la fois.`,
    exits: [ { to: "valhalla_gate", label: "Revenir vers le Walhalla" } ]
  },
  rainbow_bridge: {
    name: "Le pont de l'arc-en-ciel",
    desc: () => `Un arc de lumière et de brume relie la terre nouvelle au Walhalla. Donner y résonne encore, mais l'or maudit pèse sur chaque pas.`,
    exits: [
      { to: "gods_field", label: "Redescendre dans le pré" },
      { to: "valhalla_hall", label: "Entrer triomphalement dans le Walhalla", if: (s)=>s.act>=4 }
    ]
  },

  // ---- Scène II : Nibelheim ----
  nibelheim_shaft: {
    name: "Le puits des nains",
    desc: (s) => `La vapeur y est épaisse et le vacarme des marteaux y roule sans fin. ${s.flags.mime_freed ? "Mime, l'épaule meurtrie mais libre, vous doit une fière chandelle." : "Un nain au torse noueux, Mime, y gémit devant une enclume."}`,
    exits: [
      { to: "rhein_depths", label: "Remonter vers le Rhin" },
      { to: "nibelheim_forge", label: "Descendre à la grande forge" },
      { to: "nibelheim_mines", label: "Prendre la galerie des mines" },
      { to: "alberich_lair", label: "Se glisser vers l'antre d'Alberich", if: (s)=>s.flags.knows_lair }
    ]
  },
  nibelheim_forge: {
    name: "La grande forge de Nibelheim",
    desc: (s) => `Des centaines de nains y peinent, fouettés par la peur d'Alberich. ${s.flags.forge_song ? "Un chant de forge que vous avez appris y circule encore." : "Nul n'y chante : le maître du Tarnhelm interdit la moindre joie."}`,
    exits: [
      { to: "nibelheim_shaft", label: "Remonter au puits" },
      { to: "nibelheim_mines", label: "Aller aux mines" }
    ]
  },
  nibelheim_mines: {
    name: "Les mines de Nibelheim",
    desc: (s) => `Des galeries s'enfoncent en zigzag. ${s.flags.mine_map ? "Grâce à la carte de Mime, vous savez où mènent les trois branches." : "Trois branches s'ouvrent, et un vent mauvais en sort."}`,
    exits: [
      { to: "nibelheim_shaft", label: "Revenir au puits" },
      { to: "mine_deadfall", label: "Prendre la galerie effondrée", if: (s)=>s.flags.mine_map },
      { to: "mine_lake", label: "Prendre la galerie inondée", if: (s)=>s.flags.mine_map },
      { to: "mine_cache", label: "Prendre la galerie murée", if: (s)=>s.flags.mine_map }
    ]
  },
  mine_deadfall: {
    name: "La galerie effondrée",
    desc: () => `Un éboulis bloque la voie, mais un cliquetis d'os et d'or s'y fait entendre. Un trésor oublié des anciens Nibelungs est enseveli là.`,
    exits: [ { to: "nibelheim_mines", label: "Revenir aux mines" } ]
  },
  mine_lake: {
    name: "La galerie inondée",
    desc: () => `Un lac noir et immobile occupe le fond. Au milieu, sur un pilier, scintille quelque chose. Des bulles remontent : quelque chose vit dessous.`,
    exits: [ { to: "nibelheim_mines", label: "Revenir aux mines" } ]
  },
  mine_cache: {
    name: "La galerie murée",
    desc: (s) => `Un mur de briques naines porte l'empreinte d'une main ouverte. ${s.flags.cache_open ? "Il est ouvert sur une cache pleine de vieil or." : "Il attend une main de chair pour s'ouvrir — nul nain ne le peut."}`,
    exits: [ { to: "nibelheim_mines", label: "Revenir aux mines" } ]
  },
  alberich_lair: {
    name: "L'antre d'Alberich",
    desc: (s) => `Une salle de basalte poli où ${s.flags.alberich_captured ? "le trône est vide — son maître est prisonnier au Walhalla." : "Alberich siège, l'Anneau au doigt et le Tarnhelm à la ceinture."}`,
    exits: [ { to: "nibelheim_shaft", label: "Fuir vers le puits des nains" } ]
  },

  // ---- Scène III / IV ----
  giants_crag: {
    name: "Le rocher des géants",
    desc: (s) => `Un piton aride d'où l'on voit la terre entière. ${s.flags.fasolt_dead ? "Fafner veille seul sur le cadavre de son frère et sur l'or maudit." : "Fasolt et Fafner y attendent le tribut, l'œil dur."} La brume y sent l'orage.`,
    exits: [
      { to: "valhalla_gate", label: "Redescendre vers le Walhalla" },
      { to: "earth_mound", label: "Chercher le tertre d'Erda", if: (s)=>s.flags.knows_erda }
    ]
  },
  valhalla_rampart: {
    name: "Le rempart du Walhalla",
    desc: () => `De là-haut, la vallée du Rhin scintille. Les plaintes des filles du Rhin montent, à peine audibles, comme un reproche.`,
    exits: [ { to: "valhalla_hall", label: "Rentrer dans la salle du trône" } ]
  },
  final_shore: {
    name: "Le rivage du crépuscule",
    desc: () => `Le Rhin s'y élargit, calme et perfide. Les trois filles du Rhin y attendent l'accomplissement de toutes choses. C'est ici que l'aventure se jugera.`,
    exits: [ { to: "valhalla_gate", label: "Remonter vers le Walhalla", if:(s)=>!s.ending } ]
  }
};

/* ---------- OBJETS ---------- */
const ITEMS = {
  lettre_wotan: { name: "Lettre scellée de Wotan", desc: "Un ordre de mission : « Compte l'or, surveille les serments. — W. »" },
  perle: { name: "Perle de Woglinde", desc: "Une perle de nacre chantante, gage d'amitié du Rhin." },
  corne: { name: "Cor de conque de Floßhilde", desc: "Appelle les eaux du Rhin en cas de péril (une seule fois)." },
  tarlier: { name: "Tarnhelm (le heaume magique)", desc: "Ouvrage de Mime : transforme son porteur en forme ou en lieu quelconque." },
  anneau: { name: "🜊 L'Anneau", desc: "L'anneau forgé dans l'or renié. Il confère le pouvoir de régner — et la malédiction d'Alberich." },
  trefle_forge: { name: "Chant de forge de Nibelheim", desc: "Un air que les nains fredonnaient avant la tyrannie." },
  carte_mines: { name: "Carte des mines de Mime", desc: "Trois branches, trois dangers, trois trésors." },
  pomme: { name: "Pomme d'or de Freia", desc: "Un fruit de jeunesse : rend 10 vigueur." },
  lance_eclat: { name: "Éclat de la lance de Wotan", desc: "Un éclat des traités gravés. Preuve de serment." },
  lyre: { name: "Lyre de brume d'Erda", desc: "Jouée juste, elle endort ce qui veille." },
  vieux_or: { name: "Vieil or des Nibelungs", desc: "Un magot ancien, lourd et froid." },
  rune_mere: { name: "Rune de la Mère", desc: "Le savoir d'Erda, gravé dans l'os du monde." },
  filet_mist: { name: "Filet de brume", desc: "Tissé du brouillard de Nibelheim : rend invisible un court instant." },
  os_geant: { name: "Os de géant", desc: "Une clé massive et macabre — un levier digne de ce nom." },
  diamant_nain: { name: "Diamant nain", desc: "Pierre de valeur, monnaie des profondeurs." },
  epee_rhinemaide: { name: "Épée d'écume", desc: "Une lame d'eau vive qui ne coupe que la cupidité." }
};

/* ---------- QUÊTES ---------- */
const QUESTS = {
  rhein_promise: { name: "La promesse du Rhin", obj: ()=> "Aller au rivage du crépuscule et rendre l'or (fin)" },
  watch_ring: { name: "Le secret de l'Or", obj: (s)=> s.flags.alberich_seen ? "Suivre Alberich à Nibelheim ✔" : "Découvrir ce que devient l'or volé" },
  save_freia: { name: "Freia en péril", obj: (s)=> s.flags.ransom_paid ? "Freia est rançonnée ✔" : "Rassembler 50 pièces d'or de rançon pour les géants" },
  gold_ransom: { name: "La rançon d'or", obj: (s)=> `Or réuni : ${Math.min(S.gold,50)}/50` },
  spy_nibelheim: { name: "L'espion de Nibelheim", obj: (s)=> s.flags.alberich_captured ? "Alberich est capturé ✔ (faire rapport à Wotan)" : "Capturer Alberich par la ruse" },
  mime_help: { name: "Le forgeron fouetté", obj: (s)=> s.flags.mime_freed ? "Mime est libre ✔" : "Libérer Mime" },
  erda_riddles: { name: "Les énigmes d'Erda", obj: (s)=> `Énigmes résolues : ${((s.quests.erda_riddles||{}).prog||{}).solved||0}/3` },
  tribute: { name: "Le tribut du rocher", obj: ()=>"Assister au paiement au rocher des géants" },
  final_choice: { name: "Le destin de l'Anneau", obj: ()=>"Décider du sort de l'Anneau au rivage du crépuscule" }
};

/* ---------- SUCCÈS ---------- */
const ACHS = {
  baigneur: "Baigneur du Rhin — chanter avec les filles du Rhin",
  archéologue: "Archéologue nain — ouvrir le magot de la galerie effondrée",
  prisonnier_nain: "Preneur de nain — capturer Alberich",
  sage_erda: "Sage d'Erda — résoudre les trois énigmes",
  coeur_libre: "Cœur libre — refuser de renoncer à l'amour",
  coeur_maudit: "Cœur maudit — renoncer à l'amour pour l'or",
  chevalier_walhalla: "Chevalier du Walhalla — être adoubé par Wotan",
  libérateur: "Libérateur — rendre l'or au Rhin",
  couronne_maudite: "Roi maudit — garder l'Anneau pour soi",
  chantre: "Chantre de Nibelheim — redonner le chant aux forgerons",
  complet: "Œil de Wotan — terminer toutes les quêtes"
};
</script>
<script>
"use strict";
/* ============================================================

/* ---------- MINI-JEU : MÉMOIRE DES LEITMOTIVS ---------- */
const MOTIF_CARDS = [
  { id:"rhein", label:"🌊 Rhin", motif:"Mi — ré — fa — la" },
  { id:"walhalla", label:"🏰 Walhalla", motif:"Sol — do — mi — sol (majesté)" },
  { id:"anneau", label:"🜊 Anneau", motif:"Si — mi — si — mi (menace)" },
  { id:"erda", label:"🌍 Erda", motif:"Ré — sol — ré (sommeil)" },
  { id:"forge", label:"🔨 Forge", motif:"Ré — la — ré — la (marteau)" },
  { id:"geants", label:"⛰ Géants", motif:"Do — sol — do (poids)" }
];

function leitmotivGame() {
  const round = (S.flags.motif_round||0)+1;
  S.flags.motif_round = round;
  const len = 3 + Math.min(3, round);
  const seq = Array.from({length: len}, ()=>MOTIF_CARDS[Math.floor(Math.random()*MOTIF_CARDS.length)]);
  S.flags.last_seq = seq.map(m=>m.id);
  const seqHtml = seq.map(m=>`<span class="tag skill">${m.label}</span>`).join(" ");
  el("overlay-content").innerHTML = `
    <h2>🎼 Le jeu des leitmotivs — tour ${round}</h2>
    <p>Woglinde chante les motifs les uns après les autres. Retenez l'ordre, puis cliquez-les dans le même ordre !</p>
    <p>${seqHtml}</p>
    <p class="dim">Sequence : ${seq.map(m=>m.motif).join(" | ")}</p>
    <div class="topbtns" id="motif-btns"></div>`;
  el("overlay").style.display="flex";
  const btns = el("motif-btns");
  let input = [];
  MOTIF_CARDS.forEach(m => {
    const b = document.createElement("button");
    b.className = "tbtn"; b.textContent = m.label;
    b.onclick = () => {
      input.push(m.id);
      b.style.background = "rgba(212,175,55,.3)";
      if (input.length === seq.length) {
        closeOverlay();
        if (input.every((v,i)=>v===seq[i].id)) {
          S.flags.motif_wins = motifWinCount()+1;
          narrate(`✔ Tour réussi (${motifWinCount()}/3) ! Les auditeurs applaudissent.`, "success");
          S.gold += 5 + round*2; honorUp(3);
          if (motifWinCount()>=3) { unlockAch("oreille_doree"); finishQuest("leitmotivs"); }
          render();
        } else {
          narrate("✗ L'ordre se brise : les auditeurs rient gentiment. Réessayez !", "danger");
          damage(1); render();
        }
      }
    };
    btns.appendChild(b);
  });
  if (!S.quests.leitmotivs) startQuest("leitmotivs", "Réussir 3 tours du jeu des leitmotivs");
}

/* ouvrir la quête de la tanière quand Fafner parle */
const _orig_fafner_talk = EVENTS.giants_crag.find(e=>e.id==="fafner_talk");
const _orig_run = _orig_fafner_talk.run;
_orig_fafner_talk.run = function(){

  startQuest("taniere", "Suivre Fafner et entrer dans sa tanière");
};
</script>
<script>
"use strict";
/* ============================================================
   L'OR DU RHIN — moteur du jeu
   ============================================================ */
let S = null;

function freshState() {
  return {
    name: "Étranger",
    loc: "rhein_shallows",
    act: 1,
    hp: 20, hpMax: 20,
    honor: 50,
    gold: 0,
    renounced: false,
    time: 0,
    inv: ["lettre_wotan"],
    skills: [],
    flags: {},
    quests: {},
    achievements: {},
    visited: {},
    log: [],
    turn: 0,
    ending: null
  };
}

/* ---------- AFFICHAGE ---------- */
const el = (id)=>document.getElementById(id);

function narrate(text, cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.innerHTML = md(text);
  el("story").appendChild(d);
  el("story").scrollTop = el("story").scrollHeight;
}
function md(t) {
  return t.replace(/\*\*(.+?)\*\*/g, '<span class="gold">$1</span>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>');
}
function logLine(t) {
  S.log.unshift(`[${S.turn}] ${t}`);
  S.log = S.log.slice(0, 60);
  const d = document.createElement("div"); d.textContent = `[${S.turn}] ${t}`;
  el("log").prepend(d);
  while (el("log").children.length > 60) el("log").lastChild.remove();
}
function sFlags(f){ S.flags[f] = true; }
function addItem(id){ if(!S.inv.includes(id)) { S.inv.push(id); logLine("Obtenu : "+ITEMS[id].name); } }
function removeItem(id){ S.inv = S.inv.filter(i=>i!==id); }
function addSkill(id){ if(!S.skills.includes(id)) { S.skills.push(id); logLine("Savoir appris : "+skillName(id)); } }
function damage(n){ S.hp = Math.max(0, S.hp-n); if (S.hp<=0) death(); }
function heal(n){ S.hp = Math.min(S.hpMax, S.hp+n); }
function honorUp(n){ S.honor = Math.min(100, S.honor+n); }
function honorDown(n){ S.honor = Math.max(0, S.honor-n); }
function unlockAch(id){ if(!S.achievements[id]) { S.achievements[id]=true; narrate(`🏆 Haut fait : ${ACHS[id]}`, "success"); logLine("Haut fait : "+ACHS[id]); } }

/* ---------- QUÊTES ---------- */
function startQuest(id, desc) {
  if (S.quests[id]) return;
  S.quests[id] = { state: "active", prog: {} };
  narrate(`🗡 Nouvelle quête : **${QUESTS[id].name}** — ${desc}`, "dim");
  logLine("Quête : "+QUESTS[id].name);
}
function advanceQuest(id, key, val) {
  if (!S.quests[id]) startQuest(id, "");
  if (val!==undefined) S.quests[id].prog[key]=val; else S.quests[id].prog[key]=true;
}
function finishQuest(id) {
  if (!S.quests[id]) S.quests[id]={state:"done",prog:{}};
  S.quests[id].state = "done";
  narrate(`✔ Quête accomplie : **${QUESTS[id].name}** (+5 pièces)`, "success");
  logLine("Quête accomplie : "+QUESTS[id].name);
  S.gold += 5;
  checkAllDone();
}
function checkAllDone(){
  const ids = Object.keys(QUESTS);
  if (ids.every(q => S.quests[q] && S.quests[q].state==="done")) unlockAch("complet");
}

/* ---------- ÉNIGMES ---------- */
function openRiddle(question, answers, onWin, onLose) {
  el("overlay-content").innerHTML = `
    <h2>Énigme</h2><p>${question}</p>
    <input class="riddle-input" id="riddle-in" placeholder="Votre réponse…">
    <div class="topbtns"><button class="tbtn" id="riddle-ok">Répondre</button>
    <button class="tbtn" id="riddle-no">Y renoncer</button></div>`;
  el("overlay").style.display="flex";
  const check = () => {
    const v = el("riddle-in").value.trim().toLowerCase();
    closeOverlay();
    if (answers.some(a=>v.includes(a))) onWin(); else onLose(v);
  };
  el("riddle-ok").onclick = check;
  el("riddle-no").onclick = () => { closeOverlay(); narrate("Vous renoncez… pour l'instant.","dim"); };
  el("riddle-in").focus();
  el("riddle-in").addEventListener("keydown", e=>{ if(e.key==="Enter") check(); });
}
function closeOverlay(){ el("overlay").style.display="none"; }

const ERDA_RIDDLES = [
  { q: "Première énigme : « Je suis promise avant d'être bâtie, je loge des dieux mais coûte une déesse. Que suis-je ? »",
    a: ["walhalla","valhalla","forteresse","château","chateau"],
    hint: "Regarde la hauteur…" },
  { q: "Deuxième énigme : « Je suis forgé dans le reniement. Qui me porte tient le monde, et le perd. Que suis-je ? »",
    a: ["anneau","bague","ring"],
    hint: "Un cercle d'or…" },
  { q: "Troisième énigme : « Je suis gravé dans le bois d'une lance : tenir, c'est vivre ; trahir, c'est périr. Que suis-je ? »",
    a: ["serment","traité","traite","parole","promesse","contrat"],
    hint: "Ce que Wotan grave sur sa lance…" }
];
function erdaRiddle() {
  const solved = (S.quests.erda_riddles.prog.solved)||0;
  if (solved >= 3) { narrate("Erda n'a plus d'énigmes pour vous."); return; }
  const r = ERDA_RIDDLES[solved];
  openRiddle(r.q, r.a,
    () => {
      const n = solved+1;
      advanceQuest("erda_riddles","solved",n);
      narrate(`Erda hoche la tête : « Juste. » (${n}/3)`, "success"); heal(5); honorUp(5);
      if (n>=3) { sFlags("erda_riddles_done"); finishQuest("erda_riddles"); unlockAch("sage_erda"); addItem("lyre"); }
    },
    () => { narrate(`Erda secoue la terre : « Faux. ${r.hint} »`, "danger"); damage(2); }
  );
}

/* ---------- CHOIX FINAL ---------- */
function finalChoice() {
  const hasRing = S.inv.includes("anneau");
  el("overlay-content").innerHTML = `
    <h2>L'heure du choix</h2>
    <p>Au rivage du crépuscule, les filles du Rhin vous attendent. ${hasRing ? "L'Anneau brûle dans votre paume." : "L'Anneau est au doigt de Wotan, qui s'apprête à monter le pont d'arc-en-ciel."}</p>
    <p>Que décidez-vous, ${S.name} ?</p>
    <div class="topbtns" style="flex-direction:column">
      <button class="tbtn" id="f1">Rendre l'or et l'Anneau au Rhin, quoi qu'il m'en coûte</button>
      <button class="tbtn" id="f2">Garder l'Anneau : qui le tient règne sur le monde</button>
      <button class="tbtn" id="f3">Réclamer l'Anneau à Wotan au nom des filles du Rhin (parole et serment)</button>
      <button class="tbtn" id="f4">Jeter l'Anneau dans le Rhin et partir, sans rien demander</button>
    </div>`;
  el("overlay").style.display="flex";
  el("f1").onclick = ()=>ending(hasRing ? "rhein_ring" : "rhein_plea");
  el("f2").onclick = ()=>ending(hasRing ? "tyrant_self" : "tyrant_steal");
  el("f3").onclick = ()=>ending("wotan_plea");
  el("f4").onclick = ()=>ending("wanderer");
}

function ending(key) {
  closeOverlay();
  S.ending = key;
  const honor = S.honor, ren = S.renounced;
  const E = {
    rhein_ring: {
      t: "🜊 L'Or rendu au Rhin",
      x: `Vous tendez l'Anneau aux ondines. Woglinde le fait tourner, rieuse ; l'or s'abîme dans l'eau et le Rhin brille comme aux premiers jours. Alberich, tapi sous le pont, hurle. Les dieux montent le pont d'arc-en-ciel, et la malédiction ne les suivra pas — cette fois. « Le monde te doit une chanson », dit Floßhilde. ${honor>=70?"Vous la méritez.":""}`,
      ach: "libérateur"
    },
    rhein_plea: {
      t: "🌊 La supplique du Rhin exaucée",
      x: `Vous n'avez pas l'Anneau, mais vous avez la parole : devant tous, vous citez le serment gravé sur la lance de Wotan. Pris à son propre traité, le dieu cède l'Anneau aux filles du Rhin. Donner tonne ; l'or s'abîme dans l'eau. Le Walhalla se dresse, beau et vide de malédiction — pour un temps. Erda, quelque part, sourit dans son sommeil.`,
      ach: "libérateur"
    },
    tyrant_self: {
      t: "👑 Le roi maudit",
      x: `Vous glissez l'Anneau à votre doigt. La puissance monte comme une fièvre. Mais la malédiction d'Alberich vous connaît déjà : ${ren?"vous aviez renié l'amour, et l'or vous reconnaît pour sien.":"vous qui aimiez encore, l'or vous apprendra à ne plus aimer."} Les jours qui suivent vous assoient sur un trône — et chaque nuit, un frère, un ami, un serviteur vous trahira. Le monde est à vous. Il n'y paraît personne pour le partager.`,
      ach: "couronne_maudite"
    },
    tyrant_steal: {
      t: "🗡 Le vol du siècle",
      x: `Vous dérobez l'Anneau au doigt de Wotan au milieu du pont d'arc-en-ciel. Le dieu se retourne trop tard. Mais la malédiction ne fait pas de distinction entre voleurs : avant la nuit, les dieux vous chassent, et l'or vous pèse d'un poids de tombeau. Vous régnez sur rien, redouté de tous, aimé de personne.`,
      ach: "couronne_maudite"
    },
    wotan_plea: {
      t: "⚖️ Le droit contre la force",
      x: `Vous montez sur le pont et, devant l'assemblée des dieux, vous demandez l'Anneau au nom des filles du Rhin. Wotan hésite — puis Erda elle-même se dresse de la brume : « Rends l'anneau ! » Le dieu, la lance en avant, cède l'or au Rhin. Fasolt est mort, mais le cycle de la malédiction est brisé pour un temps. Les dieux vous saluent comme un homme de parole. ${honor>=60?"Et votre honneur le prouve.":"Nul n'oubliera, pourtant, d'où vous venez."}`,
      ach: "chevalier_walhalla"
    },
    wanderer: {
      t: "🚶 L'étranger s'en va",
      x: `Vous jetez l'or dans l'eau sans un mot et partez avant que quiconque ne vous remercie. Le Rhin chante derrière vous. Les dieux monteront leur pont ; l'or dormira ; et vous, vous porterez partout l'histoire d'un soir où le monde a failli se perdre — et où un étranger a choisi de n'en rien garder.`
    }
  };
  const e = E[key];
  if (e.ach) unlockAch(e.ach);
  narrate(`**${e.t}**\n\n${e.x}`, "gold");
  if (S.quests.rhein_promise && S.quests.rhein_promise.state==="active" && key!=="tyrant_self" && key!=="tyrant_steal") finishQuest("rhein_promise");
  if (S.quests.final_choice && S.quests.final_choice.state==="active") finishQuest("final_choice");
  narrate(`— FIN —\nHonneur final : ${S.honor}/100 · Or : ${S.gold} · Quêtes accomplies : ${Object.values(S.quests).filter(q=>q.state==="done").length}/${Object.keys(QUESTS).length}\nVous pouvez recommencer (bouton ↺) pour découvrir les ${Object.keys(E).length} fins.`, "dim");
  render();
}

/* ---------- MORT ---------- */
function death() {
  narrate(`💀 Les ténèbres vous emportent. Mais le Rhin rend volontiers ceux qu'il aime : les ondes vous reposent sur la berge, une pomme d'or à la bouche.`, "danger");
  S.hp = Math.max(6, Math.floor(S.hpMax/2));
  S.loc = "rhein_shallows";
  S.gold = Math.floor(S.gold/2);
  narrate(`Vous perdez la moitié de votre or. La légende des héros est faite de ces retours.`, "dim");
  render();
}

/* ---------- RENDU ---------- */
function render() {
  const loc = LOCATIONS[S.loc];
  el("location").textContent = "◈ " + loc.name;
  el("s-name").textContent = S.name;
  el("s-act").textContent = ["I","II","III","IV"][S.act-1] || "IV";
  el("s-hp").textContent = `${S.hp}/${S.hpMax}`;
  el("hp-bar").firstElementChild.style.width = (100*S.hp/S.hpMax)+"%";
  el("s-honor").textContent = S.honor+"/100";
  el("honor-bar").firstElementChild.style.width = S.honor+"%";
  el("s-gold").textContent = S.gold;
  el("s-love").textContent = S.renounced ? "A renié l'amour" : "Aime encore";
  el("s-time").textContent = ["Aube","Matin","Midi","Après-midi","Soir","Nuit"][Math.min(5,Math.floor(S.time/4))];
  el("inv").innerHTML = S.inv.length ? S.inv.map(i=>`<span class="tag item" title="${(ITEMS[i].desc||"").replace(/"/g,'&quot;')}">${ITEMS[i].name}</span>`).join("") : '<span class="dim">— vide —</span>';
  el("skills").innerHTML = S.skills.length ? S.skills.map(s=>`<span class="tag skill">${skillName(s)}</span>`).join("") : '<span class="dim">— aucun —</span>';
  renderChoices();
}
function skillName(s) {
  return { motif_rhein:"Motif du Rhin", motif_erda:"Motif d'Erda", motif_forge:"Chant de forge", lore_serment:"Lore des serments", tarnhelm_weakness:"Faiblesse du Tarnhelm", brave_orage:"Cœur d'orage", lore_alberich:"Colère d'Alberich" }[s] || s;
}
function renderChoices() {
  const box = el("choices"); box.innerHTML = "";
  const loc = LOCATIONS[S.loc];
  const add = (label, fn, cls) => {
    const b = document.createElement("button");
    b.className = "choice" + (cls ? " "+cls : "");
    b.innerHTML = md(label);
    b.onclick = fn;
    box.appendChild(b);
  };
  (EVENTS[S.loc]||[]).forEach(ev => {
    if (ev.once && S.flags["ev_"+ev.id]) return;
    if (ev.requires && !ev.requires(S)) return;
    add(ev.label, ()=>runEvent(ev), "quest");
  });
  loc.exits.forEach(ex => {
    if (ex.if && !ex.if(S)) return;
    if (ex.to==="giants_crag" && !S.flags.giants_crag_open) return;
    if (ex.to==="final_shore" && !S.flags.final_shore_open) return;
    add("→ " + ex.label, ()=>{
      S.loc = ex.to; S.turn++; S.time++;
      narrate(`— ${LOCATIONS[ex.to].name} —`,"dim");
      narrate(LOCATIONS[ex.to].desc(S));
      S.visited[ex.to] = true;
      render();
    }, "");
  });
  add("🍎 Se reposer (et croquer une pomme si vous en avez une)", ()=>{
    if (S.inv.includes("pomme")) { removeItem("pomme"); heal(10); narrate("La jeunesse revient dans vos membres : +10 vigueur.", "success"); }
    else { heal(4); narrate("Vous vous reposez au bord de l'eau : +4 vigueur.", "dim"); }
    S.time++; render();
  }, "");
  add("🜊 Méditer sur le renoncement à l'amour", ()=>{
    if (S.renounced) { narrate("Vous avez déjà renié l'amour. L'or vous regarde comme un parent."); return; }
    openRiddle("Renoncer à l'amour vous ouvrirait la puissance de l'or — comme Alberich. Voulez-vous sceller ce reniement ? (répondez NON pour refuser)",
      ["non","jamais"],
      ()=>{ narrate("Vous refusez. Le cœur reste entier — et l'or, muet.", "success"); honorUp(10); unlockAch("coeur_libre"); },
      ()=>{ S.renounced=true; honorDown(20); narrate("Vous prononcez le reniement, comme Alberich jadis. Un frisson d'or monte du fond : l'Or du Rhin *vous reconnaît*. (-20 honneur)", "danger"); unlockAch("coeur_maudit"); render(); });
  }, "gold");
  if (S.inv.includes("corne") && S.hp <= 5) {
    add("🐚 Souffler le cor de Floßhilde", ()=>{
      removeItem("corne"); S.hp = S.hpMax; narrate("Les eaux du Rhin vous portent et vous rendent toute votre vigueur !", "rhine"); render();
    }, "quest");
  }
}

function runEvent(ev) {
  S.flags["ev_"+ev.id] = true;
  S.turn++;
  ev.run();
  if (S.hp>0 && !S.ending) render();
}

/* ---------- AIDE / QUÊTES / SUCCÈS ---------- */
function showHelp() {
  el("overlay-content").innerHTML = `<h2>📜 Comment jouer</h2>
  <p><b>L'Or du Rhin</b> est une aventure textuelle qui suit les quatre scènes du <em>Rheingold</em> de Wagner : le Rhin, Nibelheim, le rocher des géants, et l'entrée au Walhalla.</p>
  <p>• <b>Choix</b> : cliquez sur les actions. Les boutons à liseré bleu sont des événements/quêtes, les flèches → sont des déplacements.<br>
  • <b>Vigueur</b> : votre santé. À zéro, le Rhin vous ramène — au prix de la moitié de votre or.<br>
  • <b>Honneur</b> : votre intégrité. Il conditionne certaines réactions et certaines fins.<br>
  • <b>Or</b> : 50 pièces rançonnent Freia. On en gagne en travaillant, fouillant, chantant.<br>
  • <b>Savoirs</b> : leitmotivs et lores qui débloquent des voies (le motif du Rhin apaise les eaux noires, la faiblesse du Tarnhelm permet la ruse…).<br>
  • <b>Méditer</b> : renier l'amour change le cours de certaines scènes — et votre honneur.<br>
  • Il existe <b>6 fins</b>, 9 quêtes, 3 énigmes d'Erda, des trésors cachés et 11 hauts faits. Sauvegardez souvent !</p>
  <div class="topbtns"><button class="tbtn" onclick="document.getElementById('overlay').style.display='none'">Fermer</button></div>`;
  el("overlay").style.display="flex";
}
function showQuests() {
  let h = "<h2>🗡 Journal des quêtes</h2>";
  for (const [id,q] of Object.entries(QUESTS)) {
    const st = S.quests[id] ? S.quests[id].state : "inconnue";
    h += `<p><b>${q.name}</b> — ${st==="done"?"✔ accomplie":st==="active"?"en cours":"non découverte"}<br><span class="dim">${st==="done"?"":q.obj(S)}</span></p>`;
  }
  h += `<div class="topbtns"><button class="tbtn" onclick="document.getElementById('overlay').style.display='none'">Fermer</button></div>`;
  el("overlay-content").innerHTML = h; el("overlay").style.display="flex";
}
function showAchievements() {
  let h = "<h2>🏆 Hauts faits</h2>";
  for (const [id,d] of Object.entries(ACHS)) h += `<p>${S.achievements[id]?"🟡":"⚫"} <span class="${S.achievements[id]?"":"dim"}">${d}</span></p>`;
  h += `<div class="topbtns"><button class="tbtn" onclick="document.getElementById('overlay').style.display='none'">Fermer</button></div>`;
  el("overlay-content").innerHTML = h; el("overlay").style.display="flex";
}

/* ---------- SAUVEGARDE ---------- */
function saveGame() { localStorage.setItem("rheingold_save", JSON.stringify(S)); narrate("💾 Partie sauvegardée.", "success"); }
function loadGame() {
  const raw = localStorage.getItem("rheingold_save");
  if (!raw) { narrate("Aucune sauvegarde trouvée.", "dim"); return; }
  S = JSON.parse(raw); narrate("📂 Sauvegarde chargée.", "success"); render();
}
function restart() {
  if (!confirm("Recommencer une nouvelle partie ? (la sauvegarde locale est conservée)")) return;
  S = freshState(); el("story").innerHTML=""; el("log").innerHTML=""; intro();
}

/* ---------- INTRO ---------- */
function intro() {
  el("overlay-content").innerHTML = `<h2>🜊 L'Or du Rhin</h2>
  <p><em>« Rheingold ! Rheingold ! »</em> — Au commencement du <em>Ring</em> de Wagner, l'or du Rhin brille au fond de l'eau, les dieux contractent des dettes, et un nain renonce à l'amour.</p>
  <p>Vous êtes <b>l'Étranger</b>, un mortel embarqué malgré lui dans les affaires des dieux. Comment appelez-vous votre héros ?</p>
  <input class="riddle-input" id="hero-name" placeholder="Votre nom (ou laissez vide : « Étranger »)">
  <div class="topbtns"><button class="tbtn" id="begin">Commencer l'aventure</button></div>`;
  el("overlay").style.display="flex";
  el("begin").onclick = () => {
    const n = el("hero-name").value.trim();
    if (n) S.name = n;
    closeOverlay();
    narrate(`Le prélude monte des profondeurs : un accord de mi bémol, immense, comme l'eau qui dort. Vous vous réveillez dans le lit du Rhin, étrangement capable d'y respirer. Une lettre scellée flotte près de vous : « Compte l'or, surveille les serments. — W. »`, "rhine");
    narrate(LOCATIONS.rhein_shallows.desc(S));
    render();
  };
}

/* ---------- DÉMARRAGE ---------- */
S = freshState();
intro();

const Game = { saveGame, loadGame, restart, showHelp, showQuests, showAchievements };
</script>
</body>
</html>
